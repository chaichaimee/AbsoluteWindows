summary = "نوافذ مطلقة"
description = """مجموعة الصيانة والتحكم الاحترافية لنوافذ النظام. قائمة يتم التحكم بها عبر لوحة المفاتيح تضم أدوات النظام، ومنظفاته، وتقارير الإصلاح، ومراقباً مباشراً للنظام

مفاتيح الاختصار:
ALT+Windows+W
نقرة واحدة: فتح قائمة نوافذ مطلقة
نقرتان: مراقب النظام

ALT+Windows+Z
نقرة واحدة: إنهاء التطبيقات التي لا تستجيب
نقرتان: إزالة USB بأمان"""