summary = "AbsoluteWindows"
description = """Professionelle Windows-Wartungs- und Steuerungs-Suite. Ein tastaturgesteuertes Menü mit Systemwerkzeugen, Bereinigungen, Reparaturberichten und einem Live-Systemmonitor

Tastenkombinationen:
ALT+Windows+W
Einfachtippen: AbsoluteWindows-Menü öffnen
Doppeltippen: Systemmonitor

ALT+Windows+Z
Einfachtippen: Keine Rückmeldung gebende Apps beenden
Doppeltippen: USB-Gerät sicher entfernen"""