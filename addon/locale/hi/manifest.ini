summary = "एब्सोल्यूट विंडोज"
description = """प्रोफेशनल विंडोज मेंटेनेंस एंड कंट्रोल सूट। सिस्टम टूल्स, क्लीनर्स, रिपेयर रिपोर्ट्स और एक लाइव सिस्टम मॉमोनिटर का कीबोर्ड-संचालित मेनू

हॉट कीज़:
ALT+Windows+W
सिंगल टैप : एब्सोल्यूट विंडोज मेनू खोलें
डबल टैप : सिस्टम मॉनिटर

ALT+Windows+Z
सिंगल टैप : अनुत्तरदायी ऐप्स को बंद करें (किल करें)
डबल टैप : यूएसबी को सुरक्षित रूप से हटाएं"""