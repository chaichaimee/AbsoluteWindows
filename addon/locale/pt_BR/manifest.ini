summary = "Windows Absoluto"
description = """Suíte Profissional de Manutenção e Controle do Windows. Um menu controlado por teclado com ferramentas de sistema, limpadores, relatórios de reparo e um Monitor de Sistema em tempo real

Teclas de Atalho:
ALT+Windows+W
Toque Único: Abrir menu do Windows Absoluto
Toque Duplo: Monitor do Sistema

ALT+Windows+Z
Toque Único: Encerrar aplicativos que não respondem
Toque Duplo: Remover USB com segurança"""