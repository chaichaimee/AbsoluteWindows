summary = "AbsoluteWindows"
description = """Suite Pemeliharaan & Kontrol Windows Profesional. Menu alat sistem, pembersih, laporan perbaikan, dan Monitor Sistem langsung yang digerakkan oleh keyboard

Tombol Pintas:
ALT+Windows+W
Ketuk Sekali : Buka Menu AbsoluteWindows
Ketuk Dua Kali : Monitor Sistem

ALT+Windows+Z
Ketuk Sekali : Hentikan Paksa Aplikasi yang Tidak Merespons
Ketuk Dua Kali : Lepas Aman USB"""