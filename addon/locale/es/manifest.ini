summary = "Ventanas absolutas"
description = """Suite profesional de mantenimiento y control de Windows. Un menú controlado por teclado de herramientas del sistema, limpiadores, informes de reparación y un monitor del sistema en vivo

Teclas rápidas:
ALT+Windows+W
Un toque: Abrir el menú Ventanas absolutas
Doble toque: Monitor del sistema

ALT+Windows+Z
Un toque: Cerrar aplicaciones que no responden
Doble toque: Quitar USB de forma segura"""