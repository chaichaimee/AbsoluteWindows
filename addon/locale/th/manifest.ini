summary = "AbsoluteWindows"
description = """ชุดเครื่องมือบำรุงรักษาและควบคุมวินโดวส์ระดับมืออาชีพ เมนูสั่งการด้วยคีย์บอร์ดสำหรับเครื่องมือระบบ ตัวล้างข้อมูล รายงานการซ่อมแซม และระบบติดตามสถานะแบบเรียลไทม์

คีย์ลัด:
ALT+Windows+W
กดครั้งเดียว: เปิดเมนู AbsoluteWindows
กดสองครั้ง: ตัวติดตามสถานะระบบ

ALT+Windows+Z
กดครั้งเดียว: ปิดแอปพลิเคชันที่ไม่ตอบสนอง
กดสองครั้ง: ถอด USB อย่างปลอดภัย"""