description = """Профессиональный набор для обслуживания и управления Windows. Меню системных утилит, очистителей, отчетов об исправлении и мониторинга системы в реальном времени с управлением с клавиатуры

Горячие клавиши:
ALT+Windows+W
Одиночное нажатие: открыть меню AbsoluteWindows
Двойное нажатие: монитор системы

ALT+Windows+Z
Одиночное нажатие: завершить зависшие приложения
Двойное нажатие: безопасное извлечение USB"""