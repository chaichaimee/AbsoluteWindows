summary = "AbsoluteWindows"
description = """Suite professionnelle de maintenance et de contrôle de Windows. Un menu piloté par clavier d'outils système, de nettoyeurs, de rapports de réparation et d'un moniteur système en direct

Raccourcis clavier :
ALT+Windows+W
Appui simple : Ouvrir le menu AbsoluteWindows
Appui double : Moniteur système

ALT+Windows+Z
Appui simple : Fermer les applications ne répondant pas
Appui double : Retirer le périphérique USB en toute sécurité"""